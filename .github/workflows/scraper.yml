name: Automatizar Scrapers de Precios

on:
  schedule:
    # Se ejecuta todos los días a las 3:00 AM (Hora UTC)
    - cron: '0 3 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions en GitHub

jobs:
  ejecutar-scrapers:
    runs-on: ubuntu-latest

    env:
      CI: true
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias limpias y navegador Chrome
        run: |
          rm -rf node_modules
          npm install
          npm install puppeteer puppeteer-extra puppeteer-extra-plugin-stealth
          npx puppeteer browsers install chrome

      - name: Ejecutar Scraper Lider
        continue-on-error: true
        run: node scraperLider.js

      - name: Ejecutar Scraper Jumbo
        continue-on-error: true
        run: node scraperJumbo.js

      - name: Ejecutar Scraper Santa Isabel
        continue-on-error: true
        run: node scraperSantaIsabel.js

      - name: Ejecutar Scraper Unimarc
        continue-on-error: true
        run: node scraperUnimarc.js