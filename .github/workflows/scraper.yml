name: Automatizar Scrapers de Precios

on:
  schedule:
    # Se ejecuta Lunes (1) y Viernes (5) a las 4:05 AM UTC (01:05 AM Hora Chile UTC-3)
    - cron: '5 4 * * 1,5'
  workflow_dispatch:

jobs:
  ejecutar-scrapers:
    runs-on: ubuntu-latest
    # Cada supermercado tiene sus propios 350 minutos independientes
    timeout-minutes: 350
    strategy:
      fail-fast: false # Si uno falla o demora, los otros 4 siguen corriendo normal
      matrix:
        scraper:
          - nombre: Tottus
            archivo: scraperTottus.js
          - nombre: Lider
            archivo: scraperLider.js
          - nombre: Jumbo
            archivo: scraperJumbo.js
          - nombre: Santa Isabel
            archivo: scraperSantaIsabel.js
          - nombre: Unimarc
            archivo: scraperUnimarc.js

    env:
      TZ: America/Santiago
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias limpias y navegador Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          rm -rf node_modules
          npm install
          npm install puppeteer puppeteer-extra puppeteer-extra-plugin-stealth
          npx puppeteer browsers install chrome

      - name: Ejecutar Scraper ${{ matrix.scraper.nombre }}
        continue-on-error: true
        run: xvfb-run --auto-servernum --server-args="-screen 0 1366x768x24" node ${{ matrix.scraper.archivo }}