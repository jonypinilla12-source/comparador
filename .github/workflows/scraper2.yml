name: Automatizar Scrapers de Precios 2

on:
  schedule:
    # Se ejecuta Lunes (1) y Viernes (5) a las 4:05 AM UTC (01:05 AM Hora Chile UTC-3)
    - cron: '5 4 * * 1,5'
  workflow_dispatch:

jobs:
  ejecutar-scrapers:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      TZ: America/Santiago
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias limpias y navegador Chrome
        run: |
          rm -rf node_modules
          npm install
          npm install puppeteer puppeteer-extra puppeteer-extra-plugin-stealth
          npx puppeteer browsers install chrome

      - name: Ejecutar Scraper Santa Isabel
        continue-on-error: true
        run: xvfb-run --auto-servernum --server-args="-screen 0 1366x768x24" node scraperSantaIsabel.js

      - name: Ejecutar Scraper Unimarc
        continue-on-error: true
        run: xvfb-run --auto-servernum --server-args="-screen 0 1366x768x24" node scraperUnimarc.js

      - name: Ejecutar Scraper Tottus (Con Monitor Virtual Xvfb)
        continue-on-error: true
        run: xvfb-run --auto-servernum --server-args="-screen 0 1366x768x24" node scraperTottus.js